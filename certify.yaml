# Certification pipeline for the da-cli 0.6.6 proof site.
#
#   da --org somarc --repo da-cli-0-6-6 --branch main --qmd \
#     --riverboat-gambler --commit \
#     pipeline run certify.yaml --approve evidence-build
#
# DA is authoritative for authored pages and fragments. This pipeline uploads
# only /receipts, the evidence-derived projection. One explicitly approved
# shell step verifies the generated Lottie artifact and renders that page from
# the QMD vault. Every remote operation is reviewed da-cli surface. The
# pipeline journals one outcome receipt; child steps never inherit journaling.
name: certify-0-6-6-outer-loop
steps:
  - id: evidence-build
    command: npm run check:motion && node tools/receipts-page.mjs --site somarc/da-cli-0-6-6 --out .da/out/receipts.html
    requires_approval: true
    timeout: 60s

  - id: put-receipts
    command: content put /receipts .da/out/receipts.html --strict-sections
    depends_on: [evidence-build]

  - id: preview-index
    command: preview page /index
  - id: preview-review
    command: preview page /review
  - id: preview-ledger
    command: preview page /ledger
  - id: preview-riverboat
    command: preview page /riverboat
  - id: preview-nav
    command: preview page /nav
  - id: preview-footer
    command: preview page /footer
  - id: preview-receipts
    command: preview page /receipts
    depends_on: [put-receipts]

  - id: audit-index
    command: audit full /index --format json
    depends_on: [preview-index, preview-nav, preview-footer]
  - id: audit-review
    command: audit full /review --format json
    depends_on: [preview-review, preview-nav, preview-footer]
  - id: audit-ledger
    command: audit full /ledger --format json
    depends_on: [preview-ledger, preview-nav, preview-footer]
  - id: audit-riverboat
    command: audit full /riverboat --format json
    depends_on: [preview-riverboat, preview-nav, preview-footer]
  - id: audit-receipts
    command: audit full /receipts --format json
    depends_on: [preview-receipts, preview-nav, preview-footer]

  - id: freshness
    command: site freshness / --include-shared --boundary preview --fail-on preview-stale,preview-missing,source-missing,probe-failed,unknown --format json
    depends_on: [audit-index, audit-review, audit-ledger, audit-riverboat, audit-receipts]
